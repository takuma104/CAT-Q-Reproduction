[project]
name = "cat-q-reproduction"
version = "0.1.0"
description = "Reproduction of CAT-Q: Cost-efficient and Accurate Ternary Quantization for LLMs (arXiv 2606.26650)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "lm-eval>=0.4.12",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
